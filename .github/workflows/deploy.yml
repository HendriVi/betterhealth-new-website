name: Deploy BetterHealth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check pages and visitor journeys
        run: |
          npm run preview &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/betterhealth-new-website/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-checks
          path: test-results/
          if-no-files-found: ignore
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
